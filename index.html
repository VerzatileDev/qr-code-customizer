<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>QR Generator</title>

    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <main class="app">
      <div class="app-header">
        <h1>QR Generator</h1>
        <p>Enter a URL and generate a QR code.</p>
      </div>

      <div class="editor-layout">
        <!-- LEFT SIDE -->
        <section class="controls-panel">
          <div class="input-section">
            <input type="text" id="qrInput" placeholder="https://example.com" />

            <button id="generateButton">Generate QR</button>
          </div>

          <div class="logo-section">
            <div class="logo-actions">
              <button id="logoButton" hidden>Add Logo</button>

              <button id="removeLogoButton" hidden>Remove Logo</button>
            </div>

            <!-- Hidden file picker -->
            <input
              type="file"
              id="logoInput"
              accept="image/png, image/jpeg, image/webp"
              hidden
            />

            <!-- Logo settings -->
            <div id="logoControls" hidden>
              <div class="settings-panel">
                <h2>Logo Settings</h2>

                <div class="rotation-section">
                  <label>Rotation</label>

                  <div class="rotation-buttons">
                    <button
                      type="button"
                      class="rotation-button"
                      data-rotation="0"
                    >
                      0°
                    </button>

                    <button
                      type="button"
                      class="rotation-button"
                      data-rotation="90"
                    >
                      90°
                    </button>

                    <button
                      type="button"
                      class="rotation-button"
                      data-rotation="180"
                    >
                      180°
                    </button>

                    <button
                      type="button"
                      class="rotation-button"
                      data-rotation="270"
                    >
                      270°
                    </button>
                  </div>

                  <div class="control-group">
                    <label for="logoRotation">
                      <span>Fine Rotation</span>
                      <span id="logoRotationValue">0°</span>
                    </label>

                    <input
                      type="range"
                      id="logoRotation"
                      min="-180"
                      max="180"
                      value="0"
                    />
                  </div>
                </div>

                <div class="control-group">
                  <label for="logoSize">
                    <span>Logo Size</span>
                    <span id="logoSizeValue">20%</span>
                  </label>

                  <input
                    type="range"
                    id="logoSize"
                    min="10"
                    max="100"
                    value="20"
                  />
                </div>

                <div class="control-group">
                  <label for="logoBackgroundColor">
                    <span>Background Color</span>
                    <span id="logoBackgroundColorValue">#FFFFFF</span>
                  </label>

                  <input
                    type="color"
                    id="logoBackgroundColor"
                    value="#ffffff"
                  />
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- RIGHT SIDE -->
        <section class="qr-panel">
          <div id="qrContainer"></div>

          <div class="qr-actions">
            <button id="downloadButton" hidden>Download</button>

            <button id="shareButton" hidden>Share</button>
          </div>
        </section>
      </div>
      <footer class="app-footer">
        <div class="footer-content">
          <div class="footer-left">
            <img
              src="https://avatars.githubusercontent.com/u/47317248"
              alt="VerzatileDev"
              class="footer-avatar"
            />

            <span>Made by VerzatileDev</span>
          </div>

          <div class="footer-right">
            <a
              href="https://github.com/VerzatileDev/qr-code-customizer"
              target="_blank"
              rel="noopener noreferrer"
              class="footer-link"
              aria-label="GitHub"
            >
              <svg class="footer-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.01c-3.2.7-3.87-1.54-3.87-1.54-.53-1.36-1.28-1.72-1.28-1.72-1.04-.71.08-.7.08-.7 1.15.08 1.75 1.18 1.75 1.18 1.02 1.75 2.68 1.25 3.33.96.1-.74.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.15 1.18A10.9 10.9 0 0 1 12 6.18c.97 0 1.94.13 2.85.39 2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.77.11 3.06.73.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.39-5.25 5.68.41.35.78 1.04.78 2.1v3.02c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"
                />
              </svg>

              <span>GitHub</span>
            </a>

            <a
              href="https://verzatiledev.itch.io/"
              target="_blank"
              rel="noopener noreferrer"
              class="footer-link"
              aria-label="itch.io"
            >
              <svg class="footer-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M3.1 5.2C4.4 3.7 5.8 2.4 7.2 2.4h9.6c1.4 0 2.8 1.3 4.1 2.8.7.8 1.1 1.4 1.1 2.2v10.9c0 1.8-1.5 3.3-3.3 3.3H5.3C3.5 21.6 2 20.1 2 18.3V7.4c0-.8.4-1.4 1.1-2.2Zm4.3 5.4v5.9h2.1v-3.4h5v3.4h2.1v-5.9h-9.2Z"
                />
              </svg>

              <span>itch.io</span>
            </a>
          </div>
        </div>
      </footer>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
